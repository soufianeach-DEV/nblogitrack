# Plan de deploiement Render (New > Blueprint). L'application tourne dans
# l'image du Dockerfile ; la base PostgreSQL est chez Supabase. Les valeurs
# marquees « sync: false » sont a saisir dans le tableau de bord Render,
# jamais dans ce fichier : ce sont des secrets.
services:
  - type: web
    name: nblogitrack
    runtime: docker
    # free s'endort apres 15 minutes sans visite ; starter reste eveille.
    plan: free
    region: frankfurt
    branch: fix/audit-approfondi
    envVars:
      - key: APP_NAME
        value: NBLogiTrack
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      # Render est le seul point d'entree : ses en-tetes X-Forwarded-* sont fiables.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      # L'offre gratuite de Render bloque les ports SMTP 25, 465 et 587 en
      # sortie ; Brevo accepte aussi le port 2525.
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: NBLogiTrack
      - key: MAIL_TIMEOUT
        value: "10"
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
