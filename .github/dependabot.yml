# Mises a jour de securite et de version, proposees chaque semaine en PR.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Une version publiee depuis moins de trois jours n'est pas proposee :
    # les paquets pieges sont en general retires dans ce delai.
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
