# Mises a jour de version suspendues (limite a 0) jusqu'apres la
# presentation : aucune PR de version ne s'ouvre. Les alertes de securite
# restent actives. Remettre 5 pour les reprendre.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Une version publiee depuis moins de trois jours n'est pas proposee :
    # les paquets pieges sont en general retires dans ce delai.
    cooldown:
      default-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
