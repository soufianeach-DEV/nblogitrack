name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le jeton de la CI ne fait que lire le depot : une etape compromise ne
# pourrait ni pousser de code ni modifier une PR.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # La suite tourne sur PostgreSQL, pas sur SQLite : le code ecrit du
    # SQL propre a ce moteur, « ilike », « filter (where ... ) », et un
    # verrou consultatif pour la numerotation des expeditions. Une suite
    # qui passerait ailleurs ne prouverait rien de ce qui tourne en
    # production.
    #
    # Le nom se termine par « _test » : Tests\TestCase refuse de demarrer
    # autrement, parce que chaque classe vide la base avant de commencer.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nblogitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions epinglees par empreinte de commit : un tag se reecrit, une
      # empreinte non. Dependabot propose les mises a jour.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Une faille publiee dans une dependance fait echouer la CI.
      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # La compilation vient avant les tests, et pas apres. Une page
      # rendue par Inertia reclame le manifeste que Vite produit ici :
      # sans lui, tout test qui affiche un ecran repond cinq cents,
      # alors que ceux qui verifient une redirection ou un refus
      # passent. La suite entiere se lisait de travers.
      - name: Build frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
