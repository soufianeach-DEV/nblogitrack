name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # La suite tourne sur PostgreSQL, pas sur SQLite : le code ecrit du
    # SQL propre a ce moteur, « ilike », « filter (where ... ) », et un
    # verrou consultatif pour la numerotation des expeditions. Une suite
    # qui passerait ailleurs ne prouverait rien de ce qui tourne en
    # production.
    #
    # Le nom se termine par « _test » : Tests\TestCase refuse de demarrer
    # autrement, parce que chaque classe vide la base avant de commencer.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nblogitrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build
